 <section class="box"><h3>초기 scene · 단계별 mask</h3>${t.direction_note?`<div class="notice direction-note">${esc(t.direction_note)} <a href="${esc(t.direction_comparison)}" target="_blank">${esc(t.direction_comparison_label)}</a></div>`:''}${t.scene?`<a class="small" href="${esc(t.scene_base+'TASK_REVIEW.png')}" target="_blank">설명과 모든 단계 mask를 한 장으로 보기</a>`:''}<div class="notice">초기 상태 index 0 · seed 7 · 평가 시작 시점. 모든 단계의 mask는 <strong>같은 초기 scene</strong>에 표시됩니다. 다른 초기 배치나 행동 이후의 상태는 포함하지 않습니다.</div><div class="conditions">${cs.map((c,i)=>`<button class="condition" data-stage="${i}">${i+1}. ${esc(conditionLabel(c))}</button>`).join('')}</div><div class="toolbar"><button data-mode="rgb">Scene</button><button data-mode="overlay">Mask overlay</button><button data-mode="binary">이진 mask</button></div><div class="toolbar" id="targetToggle" hidden><button id="activeMask">행동 대상 mask</button><button id="targetMask">목표 영역 mask</button></div><div id="selectionTitle"></div><div class="views" id="views"></div><details><summary>선택 단계의 mask 정보</summary><p class="small muted">source_task_description은 해당 mask를 선택하는 평가 조건의 설명입니다. 검수 대상 Task Description은 위에 표시한 지시문입니다.</p><pre id="binding"></pre></details></section>

 <div class="box"><h3>출처 및 평가 규칙</h3><div class="details-grid"><div class="source"><div class="small muted">Scene 출처</div><strong>${esc(t.scene_source_id||t.scene_family||t.anchor_suite)}</strong><p class="small">${esc(t.scene_source_instruction)}</p></div><div class="source"><div class="small muted">연결된 원본 task</div><div class="small">${esc(t.skill_source_ids)}</div><p class="small">${esc(t.skill_source_instructions)}</p></div></div><div class="links">${Object.entries(t.links).map(([n,p])=>`<a href="${esc(p)}" target="_blank" rel="noopener">${esc(n)}</a>`).join('')}${t.scene?`<a href="${esc(t.scene_base+'scene.json')}" target="_blank">Scene 기록</a>`:''}</div><details><summary>전체 평가 규칙</summary><pre>${esc(JSON.stringify(t.rules,null,2))}</pre><p class="small muted">RAIN Decomposition은 마지막 condition TC ≥ 0.7이 연속 2회이면 종료합니다. 성공 여부는 required / forbidden 규칙을 따릅니다. 다른 모델의 평가 방식은 기존과 같습니다.</p></details><details><summary>기존 평가 영상 · 참고 이미지</summary><p class="small muted">아래 영상은 완료된 RAIN 50episode 평가의 저장 기록입니다. 영상 안의 ID는 이전 ID이며, 새 ID와 대응표로 연결됩니다.</p>${t.description_revision?`<p class="small muted">현재 Task Description은 문구를 정리한 버전입니다. 기존 평가 당시 지시문: ${esc(r.evaluation_instruction)} 목표·배치·mask는 동일합니다.</p>`:''}<div class="links">${Object.entries(r.videos).map(([k,p])=>`<a href="${esc(p)}" target="_blank">${k.includes('success')?'성공 예시 영상':'실패 예시 영상'}</a>`).join('')}${t.historical_comparison?`<a href="${esc(t.historical_comparison)}" target="_blank">${esc(t.historical_comparison_label||'과거 비교 이미지')}</a>`:''}</div></details></div><div class="navigation"><button id="previous">← 이전 task</button><button id="next">다음 task →</button></div>`;
 document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=Number(b.dataset.stage);targetView=false;drawViews()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;drawViews()});
 $('activeMask').onclick=()=>{targetView=false;drawViews()};$('targetMask').onclick=()=>{targetView=true;drawViews()};$('reviewStatus').onchange=save;$('reviewNotes').oninput=save;const i=TASKS.indexOf(t);$('previous').disabled=i===0;$('next').disabled=i===TASKS.length-1;$('previous').onclick=()=>choose(TASKS[i-1].task_id);$('next').onclick=()=>choose(TASKS[i+1].task_id);drawViews();
}
function save(){notes[current.task_id]={status:$('reviewStatus').value,notes:$('reviewNotes').value,updated_at:new Date().toISOString(),legacy_task_id:current.legacy_task_id};try{localStorage.setItem(key,JSON.stringify(notes));$('saveStatus').textContent='브라우저에 저장했습니다. 전달·백업할 때는 상단의 내보내기를 사용하세요.'}catch(e){storageAvailable=false;$('saveStatus').textContent='브라우저 저장 실패: 창을 닫기 전에 기록을 내보내세요.'}list()}
function download(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('exportNotes').onclick=()=>{const rows=TASKS.map(t=>({task_id:t.task_id,legacy_task_id:t.legacy_task_id,category:t.category,instruction:t.instruction,status:state(t),notes:notes[t.task_id]?.notes||'',updated_at:notes[t.task_id]?.updated_at||''}));download('LIBERO_Analogy_task_review.json',JSON.stringify({exported_at:new Date().toISOString(),task_index_sha256:DATA.task_index_sha256,tasks:rows},null,2),'application/json')};
$('search').oninput=list;$('category').onchange=list;$('statusFilter').onchange=list;window.onhashchange=()=>{const id=decodeURIComponent(location.hash.slice(1));if(id!==current.task_id)choose(id)};render();list();
</script>
</html>
